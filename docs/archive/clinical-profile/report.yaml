decisions:
  - topic: Profile entry point
    decision: >-
      The patient name + "Profile" title renders as red, non-clickable text
      when no profile exists yet, and as an underlined clickable button
      linking to a new minimal ClinicalProfile page once a profile exists;
      the Generate button sits to the right and is always visible, only
      disabling and relabeling to "Generating…" while pending.
  - topic: Synthesis scope
    decision: >-
      Synthesis draws only from stored per-session analysis JSON
      (results_json) of sessions with status "complete", with no cap on
      session count and no use of raw transcripts.
  - topic: Regeneration semantics
    decision: >-
      Regenerating fully replaces the prior profile text and timestamp in a
      single overwrite — no incremental merge with the previous profile.
  - topic: Failure handling
    decision: >-
      A synthesis failure (LLM or network error) shows a generic inline
      error and leaves any previously persisted profile completely
      unchanged; a distinct inline error covers the zero-completed-sessions
      case.

